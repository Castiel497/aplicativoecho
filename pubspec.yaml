name: consome_plus
description: "CONSOME+ - Pense antes de comprar. App de consumo consciente com Pausa Consciente."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Gerenciamento de estado
  provider: ^6.0.0

  # Armazenamento local
  hive: ^2.2.0
  hive_flutter: ^1.1.0

  # UUID para gerar IDs únicos
  uuid: ^4.0.0

  # Ícones extras
  cupertino_icons: ^1.0.0

  # Formato de datas e moedas
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # Para gerar código Hive
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  # Assets (será preenchido depois com logo, ícones, etc)
  # assets:
  #   - assets/images/
  #   - assets/icons/
